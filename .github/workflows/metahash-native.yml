name: metahash native parity

on:
  workflow_dispatch:
  push:
    branches:
      - 'codex/metahash-native-*'

permissions:
  contents: read

jobs:
  parity:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: '3.11.5'
      - name: Build Rust CLI and metadata reference
        run: |
          uname -sm
          rustc +stable --version
          cargo +stable build --bin metahash --example native_reference
      - name: Compare Dart and Rust on the same files
        working-directory: metahashdart
        run: |
          dart --version
          dart pub get --offline
          dart analyze
          dart run test/native_test.dart ../target/debug/metahash ../target/debug/examples/native_reference
