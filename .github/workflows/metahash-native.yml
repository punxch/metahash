name: metahash native parity

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  parity:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-15, windows-2025]
        include:
          - os: windows-2025
            exe_suffix: .exe
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: '3.11.5'
      - name: Build Rust CLI and metadata reference
        run: |
          printf '%s %s\n' "$RUNNER_OS" "$RUNNER_ARCH"
          rustc +stable --version
          cargo +stable build --bin metahash --example native_reference
      - name: Compare Dart and Rust on the same files
        working-directory: metahashdart
        env:
          EXE_SUFFIX: ${{ matrix.exe_suffix }}
        run: |
          dart --version
          dart pub get --offline
          dart analyze
          dart run test/native_test.dart "../target/debug/metahash${EXE_SUFFIX}" "../target/debug/examples/native_reference${EXE_SUFFIX}"
